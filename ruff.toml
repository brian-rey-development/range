target-version = "py313"
line-length = 100
src = [
  "apps/api/src",
  "apps/worker/src",
  "packages/engine/src",
  "packages/core/src",
  "packages/infrastructure/src",
  "packages/ai/src",
]

[lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "C90", "PL", "SIM", "RUF",
  "ANN", "S", "PT", "TID", "T20", "ARG", "PERF", "RET", "TC", "FA", "PIE", "ERA", "DTZ",
]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 4
max-branches = 8
max-statements = 20
max-returns = 4

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "PLR2004", "ANN"]
