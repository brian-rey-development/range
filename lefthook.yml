pre-commit:
  parallel: true
  commands:
    ts-lint:
      glob: "*.{ts,tsx}"
      run: pnpm exec oxlint {staged_files}
    ts-format:
      glob: "*.{ts,tsx,css,json}"
      run: pnpm exec oxfmt --check {staged_files}
    py-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}
    py-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: |
        head -n 1 {1} | grep -qE '^(Merge |Revert |fixup! |(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,100}$)' || {
          echo "Commit message must follow Conventional Commits, for example: feat(ui): add button" >&2
          exit 1
        }

pre-push:
  commands:
    check:
      run: just check
