[project]
name = "range-ai"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["pydantic", "range-core", "range-engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/range_ai"]

[tool.uv.sources]
range-core = { workspace = true }
range-engine = { workspace = true }
