[project]
name = "range-infrastructure"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["range-ai", "range-core", "range-engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/range_infrastructure"]

[tool.uv.sources]
range-ai = { workspace = true }
range-core = { workspace = true }
range-engine = { workspace = true }
