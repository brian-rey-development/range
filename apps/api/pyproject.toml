[project]
name = "range-api"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "range-core",
    "range-infrastructure",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/range_api"]

[tool.uv.sources]
range-core = { workspace = true }
range-infrastructure = { workspace = true }
